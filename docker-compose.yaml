services:
  react-ui:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: react_web_app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      ui_network:
        ipv4_address: 172.31.0.5

networks:
  ui_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
